[build]
  command = "npm run build"
  publish = ".next"

# Required. Because @netlify/plugin-nextjs is a devDependency in package.json,
# Netlify skips auto-installing the Next.js Runtime and expects it to be
# declared here. Without this block the build publishes the raw .next
# directory as static files, no server handler is created, and every route
# returns "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The usual ways a bookmark or a hand-typed URL asks for the landing page.
# Netlify resolves these before the Next.js handler sees them, so each one
# arrives at the home page rather than a 404. `force` keeps them ahead of the
# catch-all rule the Next.js Runtime generates.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Vulnerability scanners probe for secrets (.env, .git, wp-login ...). Answer them
# straight from the CDN with a 404 so each probe no longer wakes the app and the database.

[[redirects]]
  from = "/.env"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.git"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.aws/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/.ssh/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/blocked.txt"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/blocked.txt"
  status = 404
  force = true
